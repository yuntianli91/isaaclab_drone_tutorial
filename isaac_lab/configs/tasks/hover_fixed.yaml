# 固定悬停任务的目标参数。
task:
  hover_height: 1.0  # 相对环境原点的目标高度 (m)。
  target_yaw: 0.0    # E 系绝对航向角 (rad)。

# 固定悬停任务的稳定观测语义。
observations:
  make_quat_unique: false  # 是否将四元数转换成实部非负的唯一表示。

# reset 时叠加到 UAV 默认初始状态的扰动参数。
reset:
  # root 位姿的均匀采样范围。
  pose_range:
    x: [-0.10, 0.10]      # X 位置增量范围 (m)。
    y: [-0.10, 0.10]      # Y 位置增量范围 (m)。
    z: [-0.05, 0.05]      # Z 位置增量范围 (m)。
    roll: [-0.05, 0.05]   # roll 姿态增量范围 (rad)。
    pitch: [-0.05, 0.05]  # pitch 姿态增量范围 (rad)。
    yaw: [-0.10, 0.10]    # yaw 姿态增量范围 (rad)。

  # root 速度的均匀采样范围。
  velocity_range:
    x: [-0.05, 0.05]      # X 线速度增量范围 (m/s)。
    y: [-0.05, 0.05]      # Y 线速度增量范围 (m/s)。
    z: [-0.05, 0.05]      # Z 线速度增量范围 (m/s)。
    roll: [-0.05, 0.05]   # X 角速度增量范围 (rad/s)。
    pitch: [-0.05, 0.05]  # Y 角速度增量范围 (rad/s)。
    yaw: [-0.05, 0.05]    # Z 角速度增量范围 (rad/s)。
